---
- name: Reload sshd
  ansible.builtin.systemd:
    name: sshd
    state: reloaded

# auditd refuses a stop from systemctl (RefuseManualStop=yes); the service
# wrapper is the supported way to restart it on RHEL.
- name: Restart auditd
  ansible.builtin.command:
    cmd: /usr/sbin/service auditd restart  # noqa: command-instead-of-module
  changed_when: true

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
