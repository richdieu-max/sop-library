name: Diagrams

on:
  push:
    branches: [main, main-clean]
  pull_request:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild every figure that has a spec
        run: python3 tools/diagrams/build.py

      - name: Committed SVGs must match their specs
        run: git diff --exit-code --stat -- '*.svg'
