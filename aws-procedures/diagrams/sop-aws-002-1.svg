<text x="74" y="603" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FF7A85" text-anchor="start">Wizard defaults: a default subnet assigns a public IP, and the suggested security group allows SSH from 0.0.0.0/0. Steps 3 to 6 change both.</text>
<text x="32" y="666" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#B6BEC9" text-anchor="start">2 AZs, 0 public IPs on instances, 0 inbound admin ports. Controls supported: SC-7, AC-17, SC-28, SC-12, CM-6, CP-9, SA-9(5).</text>
<line x1="32" y1="678" x2="1248" y2="678" stroke="#354150"/>
