<text x="866" y="614" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#B6BEC9" text-anchor="start">sg-client-vpn</text>
<text x="32" y="694" font-family="'Amazon Ember', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#B6BEC9" text-anchor="start">The browser step happens on the laptop; nothing is exposed on 35001 to the network. Controls supported: IA-2(1), IA-8, AC-17, AU-12.</text>
