<title>Apply with Ansible, judge with OpenSCAP: hardening a RHEL group in stages</title>
<defs><marker id="m605E5C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C7C7C7"/></marker></defs>
