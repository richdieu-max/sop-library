<text x="32" y="48" font-family="'Red Hat Text', 'Red Hat Display', Overpass, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF">Apply with Ansible, judge with OpenSCAP: hardening a RHEL group in stages</text>
<text x="32" y="72" font-family="'Red Hat Text', 'Red Hat Display', Overpass, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C7C7C7">Scan before, dry-run and stage on one canary, roll out in batches, scan again; every FAIL is fixed or carries a dated exception.</text>
