<text x="700" y="132" font-family="'Red Hat Text', 'Red Hat Display', Overpass, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="start">Stage: the rest</text>
