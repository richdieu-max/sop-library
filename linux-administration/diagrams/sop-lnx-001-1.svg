<text x="82" y="183" font-family="'Red Hat Text', 'Red Hat Display', Overpass, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#C7C7C7" text-anchor="start">improvement can be</text>
<text x="82" y="200" font-family="'Red Hat Text', 'Red Hat Display', Overpass, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#C7C7C7" text-anchor="start">shown</text>
